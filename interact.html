  <section class="page-head">
    <div class="en reveal">Interact</div>
    <h1 class="reveal">湖边小憩</h1>
    <p class="reveal">做一份小测验，再给湖边的旅人留一句话。</p>
  </section>

  <section class="section">
    <div class="section-title reveal"><div class="en">Quiz</div><h2>你有多了解锈湖</h2></div>
    <div class="quiz reveal" id="quiz">
      <div class="progress"><i></i></div>
      <div class="q-fade"></div>
    </div>
  </section>

  <section class="section">
    <div class="section-title reveal"><div class="en">Guestbook</div><h2>留言板</h2></div>
    <div class="guest">
      <form id="guest-form" class="reveal left">
        <label for="gname">你的名字</label>
        <input id="gname" name="name" maxlength="20" placeholder="湖边的旅人" required>
        <label for="gfav">最喜欢的作品</label>
        <select id="gfav" name="fav"><option>逃离方块系列</option><option>锈湖旅馆</option><option>锈湖：根源</option><option>锈湖：天堂岛</option><option>The Past Within</option><option>Underground Blossom</option></select>
        <label for="gtext">留言</label>
        <textarea id="gtext" name="text" maxlength="200" placeholder="写下你想说的话……" required></textarea>
        <button class="btn" type="submit">投入湖中</button>
      </form>
      <div class="msgs reveal right" id="msgs"></div>
    </div>
  </section>
